<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  
  <!-- الخلفية الدائرية -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)" stroke="#eab308" stroke-width="8"/>

  <!-- البطاقة الرقمية -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="240" height="150" rx="15" fill="#334155" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="0" y="30" width="240" height="30" fill="#0f172a"/>
    <rect x="20" y="100" width="60" height="20" rx="4" fill="#cbd5e1"/>
    <rect x="90" y="100" width="130" height="20" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- ذراع التحكم (جيم باد) -->
  <g transform="translate(60, 190)">
    <path d="M 40 30 Q 140 -10 240 30 Q 280 40 270 90 Q 260 130 220 110 L 190 90 L 90 90 L 60 110 Q 20 130 10 90 Q 0 40 40 30 Z" fill="url(#gold)"/>
    <!-- أزرار الاتجاهات -->
    <rect x="65" y="45" width="30" height="10" rx="2" fill="#0f172a"/>
    <rect x="75" y="35" width="10" height="30" rx="2" fill="#0f172a"/>
    <!-- الأزرار الجانبية -->
    <circle cx="190" cy="55" r="8" fill="#0f172a"/>
    <circle cx="215" cy="40" r="8" fill="#0f172a"/>
    <circle cx="215" cy="70" r="8" fill="#0f172a"/>
    <circle cx="240" cy="55" r="8" fill="#0f172a"/>
  </g>
</svg>
