<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- تدرج لون الخلفية الكحلي -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- تدرج اللون الذهبي لعلامة البرق -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    
    <!-- تأثير التوهج والظل للبرق -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#eab308" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- الخلفية الدائرية -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)" stroke="#eab308" stroke-width="8"/>

  <!-- علامة البرق (الصاعقة) مطابقة للصورة -->
  <path d="M 240 70 L 130 210 L 205 210 L 150 330 L 280 180 L 210 180 Z" 
        fill="url(#gold)" 
        filter="url(#glow)" 
        stroke="#fde047" 
        stroke-width="3" 
        stroke-linejoin="round"/>
</svg>
